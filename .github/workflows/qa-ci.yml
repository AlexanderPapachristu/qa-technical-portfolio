name: QA Portfolio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  markdown-link-check:
    name: Validate Markdown & Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Markdown Links & Assets
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'no'

  api-regression-tests:
    name: Run Automated API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Execute Postman Collection
        # This will execute any exported collection stored in the repo
        run: |
          if [ -d "./api-artifacts" ]; then
            newman run ./api-artifacts/vikunja-api-tests.json
          else
            echo "No exported Postman collection found yet. Skipping API runner."
          fi