name: QA Portfolio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  markdown-link-check:
    name: Validate Markdown & Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Markdown Links & Assets
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'no'

  vikunja-tests:
    name: Vikunja UI & API Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 02-vikunja-saas-task-manager
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-vikunja-saas-task-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fresh throwaway accounts for every run: random passwords, never stored anywhere
      - name: Create .env with generated test passwords
        run: |
          cp .env.example .env
          for account in OWNER READ WRITE UNRELATED SHAREADMIN TEAM TASK; do
            sed -i "s/^${account}_PASS=.*/${account}_PASS=ci-$(openssl rand -hex 12)/" .env
          done

      - name: Start Vikunja (Docker Compose) and seed accounts
        run: npm run vikunja:up

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (task lifecycle + RBAC, 3 browsers)
        run: npx playwright test

      - name: Run Postman collections (Newman)
        if: ${{ !cancelled() }}
        run: npm run test:api

      - name: Vikunja server log
        if: ${{ failure() }}
        run: docker compose logs vikunja

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 02-vikunja-saas-task-manager/playwright-report/
          retention-days: 30

      - name: Upload Newman reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: 02-vikunja-saas-task-manager/newman-report/
          retention-days: 30
