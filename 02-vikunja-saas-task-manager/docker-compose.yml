# Local Vikunja for the test suites. Accounts and data persist in named volumes,
# so they survive restarts. Only `npm run vikunja:reset` wipes them.
# Same major/minor version as try.vikunja.io when the suites were written (v2.7).
name: vikunja-qa

services:
  vikunja:
    image: vikunja/vikunja:2.7.1
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456/
      # Local test instance only. Override with VIKUNJA_SECRET in .env if you like.
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SECRET:-local-qa-instance-not-for-production}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_SERVICE_ENABLELINKSHARING: "true"
      # The suites log in six accounts per run; the default limit on login/register is far lower
      VIKUNJA_RATELIMIT_NOAUTHLIMIT: "1000"
      VIKUNJA_RATELIMIT_LIMIT: "10000"
      VIKUNJA_RATELIMIT_PERIOD: "60"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
    ports:
      # Bound to localhost only, so the instance isn't reachable from your network
      - "127.0.0.1:3456:3456"
    volumes:
      - vikunja-files:/app/vikunja/files
    depends_on:
      db:
        condition: service_healthy
      files-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  # New named volumes are owned by root, but Vikunja runs as uid 1000
  files-permissions:
    image: busybox:1.37
    command: chown -R 1000:0 /files
    volumes:
      - vikunja-files:/files

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: vikunja
      POSTGRES_DB: vikunja
    volumes:
      - vikunja-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikunja -d vikunja"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  vikunja-db:
  vikunja-files:
